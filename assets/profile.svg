<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="profile-title profile-description">

  <title id="profile-title">
    Hektor Qafarov — Middle Full-Stack Developer
  </title>

  <desc id="profile-description">
    Profile of Hektor Qafarov, his full-stack technology experience,
    and his main SaaS product, CandidLyzer.
  </desc>

  <defs>
    <!-- Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF6FA"/>
      <stop offset="48%" stop-color="#F2EAF5"/>
      <stop offset="100%" stop-color="#E8DBF0"/>
    </linearGradient>

<radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#C084FC" stop-opacity=".38"/>
  <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
</radialGradient>

<radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#93C5FD" stop-opacity=".25"/>
  <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
</radialGradient>

<linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#7C3AED"/>
  <stop offset="52%" stop-color="#A855F7"/>
  <stop offset="100%" stop-color="#D8B4FE"/>
</linearGradient>

<linearGradient id="project-card" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#1C1720"/>
  <stop offset="100%" stop-color="#0D0D0F"/>
</linearGradient>

<linearGradient id="dark-signal-card" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#34233E"/>
  <stop offset="100%" stop-color="#17131A"/>
</linearGradient>

<!-- Shadows -->
<filter id="large-shadow" x="-20%" y="-20%" width="140%" height="165%">
  <feDropShadow
    dx="0"
    dy="24"
    stdDeviation="26"
    flood-color="#533060"
    flood-opacity=".15"
  />
</filter>

<filter id="small-shadow" x="-30%" y="-30%" width="160%" height="180%">
  <feDropShadow
    dx="0"
    dy="12"
    stdDeviation="14"
    flood-color="#4C1D5F"
    flood-opacity=".14"
  />
</filter>

<!-- Prevents stack content from escaping the main container -->
<clipPath id="stack-clip">
  <rect x="0" y="0" width="1080" height="390" rx="32"/>
</clipPath>

<style>
  .sans {
    font-family:
      "Plus Jakarta Sans",
      "DM Sans",
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  .mono {
    font-family:
      "SFMono-Regular",
      Consolas,
      "Liberation Mono",
      monospace;
  }

  .eyebrow {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
  }

  .hero-name {
    font-size: 78px;
    font-weight: 780;
    letter-spacing: -4px;
  }

  .section-title {
    font-size: 32px;
    font-weight: 760;
    letter-spacing: -1.5px;
  }

  .category-title {
    font-size: 13px;
    font-weight: 850;
    letter-spacing: 1.6px;
  }

  .body {
    font-size: 19px;
    font-weight: 500;
  }

  .small {
    font-size: 15px;
    font-weight: 650;
  }

  .chip {
    font-size: 14px;
    font-weight: 720;
  }
</style>

  </defs>

