<svg
  xmlns="http://www.w3.org/2000/svg"
  width="920"
  height="250"
  viewBox="0 0 920 250"
  role="img"
  aria-label="Technology Stack"
>
  <style>
    .label {
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #8b949e;
      letter-spacing: 0.7px;
    }

    .tech {
      font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #e6edf3;
    }

    .pill {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
    }

    .accent {
      fill: #58a6ff;
    }
  </style>

  <!-- Backend -->
  <text x="20" y="30" class="label">BACKEND</text>

  <g transform="translate(20 45)">
    <rect class="pill" width="102" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">Python</text>
  </g>

  <g transform="translate(134 45)">
    <rect class="pill" width="105" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">FastAPI</text>
  </g>

  <g transform="translate(251 45)">
    <rect class="pill" width="130" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">SQLAlchemy</text>
  </g>

  <g transform="translate(393 45)">
    <rect class="pill" width="92" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">Celery</text>
  </g>

  <g transform="translate(497 45)">
    <rect class="pill" width="115" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">RabbitMQ</text>
  </g>


  <!-- Data -->
  <text x="20" y="118" class="label">DATA</text>

  <g transform="translate(20 133)">
    <rect class="pill" width="122" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">PostgreSQL</text>
  </g>

  <g transform="translate(154 133)">
    <rect class="pill" width="88" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">Redis</text>
  </g>

  <g transform="translate(254 133)">
    <rect class="pill" width="93" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">pandas</text>
  </g>

  <g transform="translate(359 133)">
    <rect class="pill" width="92" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">NumPy</text>
  </g>

  <g transform="translate(463 133)">
    <rect class="pill" width="125" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">scikit-learn</text>
  </g>


  <!-- Infrastructure -->
  <text x="20" y="206" class="label">INFRASTRUCTURE</text>

  <g transform="translate(20 216)">
    <rect class="pill" width="94" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">Docker</text>
  </g>

  <g transform="translate(126 216)">
    <rect class="pill" width="75" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">Git</text>
  </g>

  <g transform="translate(213 216)">
    <rect class="pill" width="100" height="40" rx="8"/>
    <circle class="accent" cx="19" cy="20" r="4"/>
    <text class="tech" x="32" y="25">REST API</text>
  </g>
</svg>
